[platformio]
default_envs = Micro-Node-App
src_dir = ICEMonitor

[env]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git#v1.1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
debug_build_flags = -O0 -g
debug_init_break = tbreak none
build_flags = -Wno-error=deprecated-declarations
lib_deps = https://github.com/evolved-systems-eu/libArduinoDroneCAN.git#v2.0.1-es

; --- MicroNode (STM32L431, bxCAN) ------------------------------------------
[env:Micro-Node-App]
board = MicroNode
board_build.ldscript = ldscript.ld

; --- CoreNode (STM32H743, FDCAN) -------------------------------------------
[env:Core-Node-App]
board = CoreNode
board_build.ldscript = ldscript.ld

; --- MicroNodePlus (STM32H723, FDCAN) --------------------------------------
[env:Micro-Node-Plus-App]
board = MicroNodePlus
board_build.ldscript = ldscript.ld

; --- INA228 Voltage Node (STM32L431, bxCAN) --------------------------------
; Reads bus voltage from an Adafruit INA228 breakout over I2C and broadcasts
; uavcan.protocol.debug.KeyValue at 5 Hz.  Source: examples/INA_228_voltage/
; To build: pio run -e INA228-Micro-Node-App
[env:INA228-Micro-Node-App]
board = MicroNode
board_build.ldscript = ldscript.ld
build_src_filter = -<*> +<../examples/INA_228_voltage/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit INA228 Library@3.0.0
    adafruit/Adafruit BusIO@1.17.4
